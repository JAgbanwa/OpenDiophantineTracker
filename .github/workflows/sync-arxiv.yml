name: Synchronize arXiv paper

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synchronize-arxiv-paper
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tracker
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify synchronization parser
        run: python -m unittest discover -s tests -v

      - name: Check arXiv and update ledger
        run: python scripts/sync_arxiv.py

      - name: Detect generated change
        id: changes
        run: |
          if git diff --quiet -- data/paper-sync.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synchronized paper data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper-sync.js
          git commit -m "Sync arXiv paper status"
          git push
