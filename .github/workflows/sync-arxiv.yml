name: Synchronize arXiv paper

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/sync-arxiv.yml
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/sync-arxiv.yml

permissions:
  contents: read

concurrency:
  group: synchronize-arxiv-paper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tracker
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify synchronization parser
        run: python -m unittest discover -s tests -v

  synchronize:
    needs: verify
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tracker
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node for catalogue export
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check arXiv and update ledger
        run: python scripts/sync_arxiv.py

      - name: Detect generated change
        id: changes
        run: |
          if git diff --quiet -- data/paper-sync.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synchronized paper data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper-sync.js
          git commit -m "Sync arXiv paper status"
          git push
